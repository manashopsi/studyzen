<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyZen V1.1</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #222;
}

header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 32px;
}

header p {
    margin-top: 8px;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

select {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 10px;
}

button {
    border: none;
    padding: 12px 18px;
    margin: 8px 5px 0 0;
    border-radius: 10px;
    background: #4f46e5;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #3730a3;
}

.subjects {
    display: none;
    margin-top: 20px;
}

.subject {
    background: #eef2ff;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>📚 StudyZen</h1>
    <p>Study smarter. Learn better. 🚀</p>
</header>

<div class="container">

    <div class="card">
        <h2>🎓 Select Your Class</h2>

        <select id="classSelect">
            <option value="">-- Select Class --</option>
            <option value="1">Class 1</option>
<option value="1">Class 1</option>
<option value="2">Class 2</option>
<option value="3">Class 3</option>
<option value="4">Class 4</option>
<option value="5">Class 5</option>
<option value="6">Class 6</option>
<option value="7">Class 7</option>
<option value="8">Class 8</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
        </select>

        <p class="message" id="message"></p>
    </div>


    <div class="card">
        <h2>📖 Subjects</h2>

        <div id="subjects" class="subjects">

            <div class="subject">
                <h3>➗ Mathematics</h3>
                <button onclick="openSubject('Mathematics')">
                    Open Maths
                </button>
            </div>

            <div class="subject">
                <h3>🔬 Science</h3>
                <button onclick="openSubject('Science')">
                    Open Science
                </button>
            </div>

            <div class="subject">
                <h3>🌍 Social Science</h3>
                <button onclick="openSubject('Social Science')">
                    Open SST
                </button>
            </div>

            <div class="subject">
                <h3>📘 English</h3>
                <button onclick="openSubject('English')">
                    Open English
                </button>
            </div>

            <div class="subject">
                <h3>💻 Computer</h3>
                <button onclick="openSubject('Computer')">
                    Open Computer
                </button>
            </div>

        </div>
    </div>


    <div class="card">
        <h2>⚡ Quick Tools</h2>

        <button onclick="showMessage('📝 Notes section coming soon!')">
            📝 Notes
        </button>

        <button onclick="showMessage('🧠 Quiz section coming soon!')">
            🧠 Quiz
        </button>

        <button onclick="showMessage('📊 Progress tracker coming soon!')">
            📊 Progress
        </button>

        <button onclick="showMessage('🎯 Practice section coming soon!')">
            🎯 Practice
        </button>

        <p class="message" id="toolMessage"></p>
    </div>

</div>


<script>

const classSelect = document.getElementById("classSelect");
const subjects = document.getElementById("subjects");
const message = document.getElementById("message");

classSelect.addEventListener("change", function () {

    if (this.value === "") {
        subjects.style.display = "none";
        message.innerText = "";
        return;
    }

    subjects.style.display = "block";

    message.innerText =
        "✅ Class " + this.value + " selected!";

});


function openSubject(subject) {

    const selectedClass = classSelect.value;

    if (selectedClass === "") {
        alert("⚠️ Pehle class select karo!");
        return;
    }

    alert(
        "📚 StudyZen\n\n" +
        "Class: " + selectedClass +
        "\nSubject: " + subject +
        "\n\n🚀 Section opening soon!"
    );
}


function showMessage(text) {
    document.getElementById("toolMessage").innerText = text;
}

</script>

</body>
</html>
