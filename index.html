<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyZen V1.1</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f4f6ff;color:#222;transition:.3s}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:28px;text-align:center}
header h1{font-size:38px}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:white;padding:22px;margin:15px 0;border-radius:18px;box-shadow:0 5px 18px #0001}
select,input{width:100%;padding:13px;margin:8px 0;border:2px solid #ddd;border-radius:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.item{background:#eef2ff;padding:18px;border-radius:14px;text-align:center}
button{border:0;background:#4f46e5;color:white;padding:11px 16px;border-radius:9px;margin-top:10px;cursor:pointer}
button:hover{background:#3730a3}
.back{background:#555}
.hidden{display:none}
.chapter{text-align:left;background:#f8f8ff;padding:14px;margin:8px 0;border-radius:10px}
.progress{height:15px;background:#ddd;border-radius:20px;overflow:hidden;margin-top:10px}
.bar{height:100%;width:0;background:#4f46e5}
#result{font-weight:bold;margin-top:12px}
.dark{background:#15151d;color:#eee}
.dark .card{background:#22232d}
.dark .item,.dark .chapter{background:#30313d}
.dark select,.dark input{background:#22232d;color:white}
</style>
</head>

<body>

<header>
<h1>📚 StudyZen</h1>
<p>Learn • Practice • Improve 🚀</p>
</header>

<div class="container">

<div class="card">
<h2>🎓 Choose Class</h2>
<select id="classSelect">
<option value="">-- Select Class --</option>
<script>
for(let i=1;i<=12;i++)
document.write(`<option value="${i}">Class ${i}</option>`);
</script>
</select>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>📚 Subjects</h2>
<div id="subjects" class="grid"></div>
</div>

<div class="card">
<h2>⚡ Study Tools</h2>
<div class="grid">
<div class="item">📝<h3>Notes</h3><button onclick="showNotes()">Open</button></div>
<div class="item">🧠<h3>Quiz</h3><button onclick="startQuiz()">Start</button></div>
<div class="item">🎯<h3>Practice</h3><button onclick="practice()">Practice</button></div>
<div class="item">📊<h3>Progress</h3><button onclick="showProgress()">View</button></div>
<div class="item">🔍<h3>Search</h3><button onclick="searchBox()">Search</button></div>
<div class="item">🌙<h3>Dark Mode</h3><button onclick="darkMode()">Toggle</button></div>
</div>
</div>

</div>

<div id="content"></div>

</div>

<script>

/* ================= SUBJECT DATA ================= */

const subjects={
1:["English","Mathematics","Hindi","EVS","Computer"],
2:["English","Mathematics","Hindi","EVS","Computer"],
3:["English","Mathematics","Hindi","EVS","Computer"],
4:["English","Mathematics","Hindi","EVS","Computer"],
5:["English","Mathematics","Hindi","EVS","Computer"],
6:["English","Mathematics","Science","Social Science","Hindi","Computer"],
7:["English","Mathematics","Science","Social Science","Hindi","Computer"],
8:["English","Mathematics","Science","Social Science","Hindi","Computer"],

9:["English","Mathematics","Science","Social Science","Hindi","Computer","Artificial Intelligence"],

10:["English","Mathematics","Science","Social Science","Hindi","Computer","Artificial Intelligence"],

11:[
"English","Physics","Chemistry","Mathematics",
"Biology","Computer Science","Economics",
"Accountancy","Business Studies","Political Science",
"Geography","History","Psychology","Physical Education"
],

12:[
"English","Physics","Chemistry","Mathematics",
"Biology","Computer Science","Economics",
"Accountancy","Business Studies","Political Science",
"Geography","History","Psychology","Physical Education"
]
};

/* ================= CHAPTER DATA ================= */

const chapters={
"Mathematics":[
"Number Systems","Algebra","Linear Equations",
"Geometry","Mensuration","Statistics",
"Probability","Coordinate Geometry"
],

"Science":[
"Physical and Chemical Changes","Matter",
"Motion","Force and Pressure","Heat",
"Light","Sound","Electricity",
"Environment","Life Processes"
],

"English":[
"Reading Comprehension","Grammar",
"Writing Skills","Literature",
"Vocabulary"
],

"Social Science":[
"History","Geography","Political Science",
"Economics","Map Work"
],

"Hindi":[
"व्याकरण","पठन","लेखन","साहित्य","शब्द भंडार"
],

"Computer":[
"Computer Basics","Internet","Coding",
"Algorithms","Cyber Safety","AI Basics"
],

"Artificial Intelligence":[
"AI Basics","Data","Machine Learning",
"Computer Vision","Natural Language",
"AI Ethics"
],

"Physics":[
"Units and Measurements",
"Motion","Laws of Motion",
"Work Energy and Power",
"Gravitation","Thermodynamics",
"Waves","Electricity","Optics"
],

"Chemistry":[
"Some Basic Concepts",
"Structure of Atom",
"Chemical Bonding",
"Thermodynamics",
"Equilibrium",
"Organic Chemistry",
"Electrochemistry"
],

"Biology":[
"Cell","Biomolecules",
"Plant Physiology","Human Physiology",
"Genetics","Ecology","Evolution"
],

"Computer Science":[
"Python Basics","Data Types",
"Conditional Statements","Loops",
"Functions","Lists","Dictionaries",
"File Handling","SQL","Computer Networks"
],

"Economics":[
"Introduction","Statistics",
"Demand and Supply","Production",
"Markets","National Income",
"Money and Banking"
],

"Accountancy":[
"Introduction","Journal",
"Ledger","Trial Balance",
"Depreciation","Financial Statements",
"Partnership","Company Accounts"
],

"Business Studies":[
"Nature of Business",
"Forms of Business",
"Private and Public Sector",
"Business Services",
"Management","Marketing","Finance"
],

"Political Science":[
"Constitution","Rights",
"Political Institutions",
"Federalism","Democracy",
"Political Theory","International Relations"
],

"Geography":[
"Physical Geography",
"Landforms","Climate",
"Water","Resources",
"Population","Maps"
],

"History":[
"Ancient History",
"Medieval History",
"Modern History",
"World History",
"Indian National Movement"
],

"Psychology":[
"Introduction to Psychology",
"Methods","Human Development",
"Learning","Memory",
"Motivation","Personality"
],

"Physical Education":[
"Fitness","Yoga","Sports",
"Nutrition","Training",
"Health and Wellness"
]
};

/* ================= CLASS CHANGE ================= */

const classSelect=document.getElementById("classSelect");
const dashboard=document.getElementById("dashboard");
const subjectBox=document.getElementById("subjects");
const content=document.getElementById("content");

classSelect.addEventListener("change",()=>{

let c=classSelect.value;

if(!c){
dashboard.classList.add("hidden");
return;
}

dashboard.classList.remove("hidden");

subjectBox.innerHTML="";

subjects[c].forEach(s=>{
subjectBox.innerHTML+=`
<div class="item">
<h3>📘 ${s}</h3>
<button onclick="openSubject('${s}')">Open</button>
</div>`;
});

content.innerHTML="";
});

/* ================= SUBJECT ================= */

function openSubject(subject){

let list=chapters[subject]||[
"Introduction",
"Chapter 1",
"Chapter 2",
"Chapter 3",
"Revision"
];

content.innerHTML=`
<div class="card">
<button class="back" onclick="closeContent()">← Back</button>
<h2>📖 ${subject}</h2>
<p>🎓 Class ${classSelect.value}</p>
<br>
<h3>Chapters</h3>

${list.map((x,i)=>`
<div class="chapter">
<b>${i+1}. ${x}</b>
<br>
<button onclick="openChapter('${x}')">📚 Study</button>
</div>
`).join("")}

</div>`;
}

/* ================= CHAPTER ================= */

function openChapter(chapter){

content.innerHTML=`
<div class="card">
<button class="back" onclick="openSubject('${findSubject(chapter)}')">← Back</button>

<h2>📖 ${chapter}</h2>

<h3>📝 Quick Notes</h3>
<p style="margin-top:10px">
This is your StudyZen learning space for
<b>${chapter}</b>.
Read your textbook, make notes and revise
the important concepts here.
</p>

<br>

<h3>🎯 What to do?</h3>
<ul style="margin:12px 0 0 20px">
<li>Read the chapter</li>
<li>Write important points</li>
<li>Practice questions</li>
<li>Take a quiz</li>
</ul>

<br>

<button onclick="startQuiz()">🧠 Take Quiz</button>
<button onclick="practice()">🎯 Practice</button>

</div>`;
}

function findSubject(chapter){

for(let s in chapters)
if(chapters[s].includes(chapter)) return s;

return "Mathematics";
}

/* ================= NOTES ================= */

function showNotes(){

content.innerHTML=`
<div class="card">
<button class="back" onclick="closeContent()">← Back</button>
<h2>📝 My Notes</h2>

<textarea id="notes"
style="width:100%;height:250px;margin-top:15px;padding:15px;border-radius:10px;border:2px solid #ddd"
placeholder="Write your notes here..."></textarea>

<br>
<button onclick="saveNotes()">💾 Save Notes</button>
<p id="noteStatus"></p>
</div>`;
}

/* ================= SAVE NOTES ================= */

function saveNotes(){

let n=document.getElementById("notes").value;

localStorage.setItem("studyzenNotes",n);

document.getElementById("noteStatus").innerText=
"✅ Notes saved!";
}

/* ================= QUIZ ================= */

let quizQuestions=[
["What is 5 × 6?","30"],
["What is the capital of India?","New Delhi"],
["Which planet is called the Red Planet?","Mars"],
["What is H₂O?","Water"],
["How many sides does a triangle have?","3"]
];

function startQuiz(){

let q=quizQuestions[Math.floor(Math.random()*quizQuestions.length)];

content.innerHTML=`
<div class="card">
<button class="back" onclick="closeContent()">← Back</button>

<h2>🧠 Quick Quiz</h2>

<h3 style="margin-top:20px">${q[0]}</h3>

<input id="answer" placeholder="Type your answer">

<button onclick="checkAnswer('${q[1]}')">
Submit
</button>

<p id="result"></p>
</div>`;
}

function checkAnswer(correct){

let ans=document.getElementById("answer").value
.trim().toLowerCase();

if(ans===correct.toLowerCase()){

document.getElementById("result").innerText=
"🎉 Correct! Great job!";

saveScore();

}else{

document.getElementById("result").innerText=
"❌ Not quite. Try again!";
}
}

/* ================= PRACTICE ================= */

function practice(){

content.innerHTML=`
<div class="card">
<button class="back" onclick="closeContent()">← Back</button>

<h2>🎯 Practice Zone</h2>

<p style="margin-top:15px">
Solve questions from your textbook,
then check your answers carefully.
</p>

<br>

<h3>Question 1</h3>
<p>Calculate: 25 + 37</p>
<input id="p1">

<h3>Question 2</h3>
<p>What is the largest planet?</p>
<input id="p2">

<button onclick="checkPractice()">Check</button>

<p id="result"></p>
</div>`;
}

function checkPractice(){

let a=document.getElementById("p1").value.trim();
let b=document.getElementById("p2").value.trim().toLowerCase();

let score=0;

if(a==="62")score++;
if(b==="jupiter")score++;

document.getElementById("result").innerText=
"⭐ Score: "+score+"/2";
}

/* ================= PROGRESS ================= */

function saveScore(){

let score=Number(localStorage.getItem("studyzenScore")||0);

score++;

localStorage.setItem("studyzenScore",score);
}

function showProgress(){

let score=Number(localStorage.getItem("studyzenScore")||0);

content.innerHTML=`
<div class="card">
<button class="back" onclick="closeContent()">← Back</button>

<h2>📊 My Progress</h2>

<p style="margin-top:15px">
Quiz questions answered correctly:
<b>${score}</b>
</p>

<div class="progress">
<div class="bar" style="width:${Math.min(score*10,100)}%"></div>
</div>

<br>
<p>Keep learning! 🚀</p>
</div>`;
}

/* ================= SEARCH ================= */

function searchBox(){

content.innerHTML=`
<div class="card">
<button class="back" onclick="closeContent()">← Back</button>

<h2>🔍 Search StudyZen</h2>

<input id="search"
placeholder="Search subject or chapter..."
oninput="searchNow()">

<div id="searchResults"></div>
</div>`;
}

function searchNow(){

let text=document.getElementById("search").value.toLowerCase();
let results=[];

for(let c in chapters){

if(c.toLowerCase().includes(text))
results.push("📘 "+c);

chapters[c].forEach(ch=>{
if(ch.toLowerCase().includes(text))
results.push("📖 "+ch);
});
}

document.getElementById("searchResults").innerHTML=
results.slice(0,20).map(x=>
`<div class="chapter">${x}</div>`
).join("");
}

/* ================= DARK MODE ================= */

function darkMode(){

document.body.classList.toggle("dark");

localStorage.setItem(
"studyzenDark",
document.body.classList.contains("dark")
);
}

/* ================= BACK ================= */

function closeContent(){

content.innerHTML="";
}

/* ================= LOAD ================= */

if(localStorage.getItem("studyzenDark")==="true")
document.body.classList.add("dark");

</script>

<footer style="text-align:center;padding:25px;color:#777">
StudyZen V1.1 🚀 | Learn Smarter
</footer>

</body>
</html>
